<!doctype html>
<html lang="en">

<head>
    <title>Management System - Login</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Header / Navbar -->
    <header>
        <nav class="navbar navbar-dark">
            <div class="container-fluid nav-container">
                <a class="navbar-brand fw-bold mb-0 text-white text-decoration-none" href="index.html">Management System</a>
                <div class="dropdown">
                    <button class="btn btn-nav dropdown-toggle" type="button" id="dropdownMenuButton1"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        Home
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton1">
                        <li><a class="dropdown-item" href="index.html">Home</a></li>
                        <li><a class="dropdown-item" href="login.html">Login</a></li>
                        <li><a class="dropdown-item" href="#">Sign up</a></li>
                        <li><a class="dropdown-item" href="#">Help</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content: Login Form -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">
                    <div class="card login-card shadow-sm border-0">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center mb-4">
                                <h3 class="fw-bold mb-1" style="color: #172a51;">Welcome Back</h3>
                                <p class="text-secondary small mb-0">Please sign in to access your courses</p>
                            </div>

                            <form action="home.html" method="get">
                                <div class="mb-3">
                                    <label for="username" class="form-label fw-semibold text-secondary small">Username or Email</label>
                                    <input type="text" class="form-control form-control-lg fs-6" id="username"
                                        placeholder="admin@example.com" value="student" required />
                                </div>

                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label for="password" class="form-label fw-semibold text-secondary small mb-0">Password</label>
                                        <a href="#" class="small text-decoration-none" style="color: #172a51;">Forgot?</a>
                                    </div>
                                    <input type="password" class="form-control form-control-lg fs-6" id="password"
                                        placeholder="Enter password" value="123456" required />
                                </div>

                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" checked />
                                    <label class="form-check-label text-secondary small" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-login w-100 py-2 fw-semibold">
                                    Login
                                </button>
                            </form>

                            <div class="text-center mt-4 pt-2 border-top">
                                <p class="text-secondary small mb-0">
                                    Don't have an account? <a href="#" class="text-decoration-none fw-semibold" style="color: #172a51;">Sign up</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer text-center">
        <div class="container">
            <p class="mb-0">Copyright 2026 Management System</p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
